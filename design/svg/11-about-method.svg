  <text x="980" y="250" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#52525b">2. AFF 单独标注</text>
  <text x="1180" y="250" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#52525b">3. 赞助固定数量</text>
  <text x="780" y="290" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#52525b">4. 不隐藏风险</text>
  <text x="980" y="290" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#52525b">5. 不参与灰色交易</text>
