  <text x="80" y="570" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#3f3f46">订阅成本 = 套餐价格 ÷ 套餐额度</text>
  <text x="80" y="610" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#3f3f46">破局点 = 当按量成本 = 订阅成本时的用量</text>
