  <text x="280" y="280" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">缓存命中率：20%</text>
  <text x="80" y="310" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">并发要求：50</text>
