  <rect x="940" y="420" width="120" height="36" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="960" y="443" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2563eb">复制链接</text>
  <rect x="1080" y="420" width="120" height="36" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="1100" y="443" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#2563eb">复制 Markdown</text>
  <rect x="48" y="720" width="1344" height="100" rx="16" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="64" y="750" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#0f172a">假设与限制</text>
  <text x="80" y="770" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1d4ed8">1. 汇率按公开页折算；2. 订阅额度按 30 天折算；3. 卡密只作为购买路径，不影响成本。</text>
  <line x1="48" y1="848" x2="1392" y2="848" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="874" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">© 2026 token比比</text>
