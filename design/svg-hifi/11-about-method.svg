  <text x="780" y="250" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">1. 广告不影响排序</text>
  <text x="980" y="250" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">2. AFF 单独标注</text>
  <text x="1180" y="250" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">3. 赞助固定数量</text>
  <text x="780" y="290" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">4. 不隐藏风险</text>
  <text x="980" y="290" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">5. 不参与灰色交易</text>
  <text x="1180" y="290" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#475569">6. 收录不等于推荐</text>
  <rect x="48" y="470" width="1344" height="160" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
