  <text x="80" y="570" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#475569">订阅成本 = 套餐价格 ÷ 套餐额度</text>
  <text x="80" y="610" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#475569">破局点 = 当按量成本 = 订阅成本时的用量</text>
  <rect x="48" y="670" width="1344" height="120" rx="16" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="64" y="700" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#0f172a">免责声明</text>
